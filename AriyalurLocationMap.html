<style>
    .topbar {
      max-width: 1280px;
      margin: 0 auto 8px;
      padding: 8px 10px;
      border: 2px solid #c47a44;
      border-radius: 14px;
      background: linear-gradient(180deg, #fff8ef 0%, #ffe9d4 100%);
    }

    .topbar-row {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      gap: 8px;
    }

    .arrow-link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .arrow-img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      display: block;
    }

    .topbar-center {
      text-align: center;
      min-width: 0;
    }

    .topbar-title {
      margin: 0;
      color: var(--heading-blue);
      font-size: clamp(0.95rem, 2.3vw, 1.2rem);
      line-height: 1.2;
      font-weight: 700;
    }

    .topbar-subtitle {
      margin: 2px 0 0;
      color: var(--heading-brown);
      font-size: clamp(0.78rem, 1.9vw, 0.95rem);
      line-height: 1.2;
      font-weight: 600;
    }

    .topbar-actions {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .topbar-actions a {
      text-decoration: none;
      flex: 0 1 auto;
    }

    .nav-btn,
    .footer-btn {
      min-height: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--btn-border);
      background: #ffffff;
      color: #1f2d3d;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 0 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      min-width: 150px;
    }

    .nav-btn:hover,
    .footer-btn:hover {
      background: var(--btn-hover);
      color: #fff;
      border-color: var(--btn-hover);
    }

        div {
            display: flex;    
            align-items: center;  
            margin: auto;       
        }

        .title-div {
            column-gap: 20px;
            text-align: center;
        }
         
        h3 {
            color: brown;            
        }

        h2 {
            color: blue;  text-align: center;
        }
   

    img {
            max-width: 100%;
            max-height: 100%;
        }  

.top-nav{
  background:#d8f3e8;
  border:1px solid #99c8b4;
  border-radius:14px;
  padding:10px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:nowrap;
  overflow-x:auto;
  scrollbar-width:thin;
  margin:10px auto 12px;
  max-width:100%;
}

.top-nav a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:34px;
  min-width:132px;
  padding:0 10px;
  border-radius:999px;
  text-decoration:none;
  border:1px solid #2457b3;
  background:linear-gradient(180deg,#eaf2ff 0%,#cfe0ff 100%);
  color:#0f2f6b;
  font-weight:700;
  font-size:.78rem;
  white-space:nowrap;
  text-align:center;
  box-shadow:0 1px 3px rgba(20,50,110,.2);
  transition:all .22s ease;
  flex:0 0 auto;
}

.top-nav a:hover{
  background:linear-gradient(180deg,#3a72d8 0%,#2457b3 100%);
  color:#fff;
  transform:translateY(-1px);
  box-shadow:0 5px 12px rgba(27,70,143,.25);
}

.top-nav a:focus-visible{
  outline:3px solid #2f66cc;
  outline-offset:2px;
  box-shadow:0 0 0 4px rgba(47,102,204,.2);
}

@media (max-width:768px){
  .top-nav{
    flex-wrap:wrap;
    overflow-x:visible;
  }
  .top-nav a{
    min-width:124px;
    font-size:.76rem;
  }
}

@media (max-width:420px){
  .top-nav a{
    min-width:116px;
    font-size:.74rem;
    padding:0 8px;
  }
}
    </style>
