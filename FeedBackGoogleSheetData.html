<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Google Sheets</title>
        <style>
                    :root {
          --heading-blue: #0047ab;
          --heading-brown: #7a2f00;
          --btn-border: #8a8a8a;
          --btn-hover: goldenrod;
        }

        .topbar {
          max-width: 1280px;
          margin: 0 auto 8px;
          padding: 8px 10px;
          border: 2px solid #c47a44;
          border-radius: 14px;
          background: linear-gradient(180deg, #fff8ef 0%, #ffe9d4 100%);
        }

        .topbar-row {
          display: grid;
          grid-template-columns: 40px 1fr 40px;
          align-items: center;
          gap: 8px;
        }

        .arrow-link {
          display: flex;
          align-items: center;
          justify-content: center;
          text-decoration: none;
        }

        .arrow-img {
          width: 40px;
          height: 40px;
          object-fit: contain;
          display: block;
        }

        .topbar-center {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          min-width: 0;
        }

        .topbar-title {
          margin: 0;
          color: var(--heading-blue);
          font-size: clamp(0.95rem, 2.3vw, 1.4rem);
          line-height: 1.2;
          font-weight: 900;
        }

        .topbar-subtitle {
          margin: 2px 0 0;
          color: var(--heading-brown);
          font-size: clamp(0.78rem, 1.9vw, 1.2rem);
          line-height: 1.2;
          font-weight: 800;
        }

        .topbar-actions {
          margin-top: 8px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
          flex-wrap: nowrap;
          text-align: center;
        }

        .topbar-actions a {
          text-decoration: none;
          flex: 0 1 auto;
        }

        .nav-btn,
        .footer-btn {
          min-height: 34px;
          height: 34px;
          border-radius: 999px;
          border: 1px solid var(--btn-border);
          background: #ffffff;
          color: #1f2d3d;
          font-weight: 700;
          font-size: 0.82rem;
          padding: 0 12px;
          cursor: pointer;
          transition: all 0.2s ease;
          white-space: nowrap;
          min-width: 150px;
        }

        .nav-btn:hover,
        .footer-btn:hover {
          background: var(--btn-hover);
          color: #fff;
          border-color: var(--btn-hover);
        }

        h2 {
          color: blue;
          text-align: center;
          margin-bottom: 0px;
        }    
        
        .arrow-img:hover {
          transform: scale(1.3);
          transition: transform 0.2s ease-in-out;
        }

        .nav-btn:hover {
          transform: scale(1.15);
          transition: transform 0.2s ease-in-out;
        }

        img {
          max-height: 100%;
          max-width: 100%;
        }

            form {
                max-width: 600px;
                background-color: bisque;
                align-self:"center";
                justify-content:"center";
                padding: 10px 20px;
                margin: auto;
                border: 1px solid rgb(22, 20, 20);
                border-radius: 10px;
            }
            input[type="text"],
            input[type="email"],
            input[type="number"], 
            input[type="feedback"],
                               
            textarea {
                width: 100%;
                padding: 8px;
                margin: 5px 0 15px 0;
                border: 4px rgb(29, 31, 32);
                border-radius: 5px;
                overflow-wrap: break-word;
                background-color: rgb(250, 250, 127);
            }

            input[type="submit"] {
                background-color: gray;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 20px;
                margin: 0;
                cursor: pointer;                
            }

            input[type="submit"]:hover{
                background-color: rgb(230, 142, 48);                
            }

            .button-container {
                display: flex;
                justify-content: center;
                width: 100%;
                gap:20px;
                margin-top: 10px;   
            }

            .exit-container {
                display: inline-flex;
                gap: 60px;
                align-self: center;
                justify-content: center;
                margin-left: 400px;
            }

            .exit-button {
                border-radius: 20px;
                background-color: lightblue;
                padding: 15px;
                align-items: flex-end;
            }

            h1 {
                 color: blue;
            }
        </style>
</head>
<body>
    <header class="topbar">
      <div class="topbar-row">
        <a class="arrow-link" href="AriyalurGeologyPage.html" aria-label="Back to Previous Item in Menu">
          <img class="arrow-img" src="Arrow Left Very Small Amber.jpg" alt="Left Arrow" />
        </a>

        <div class="topbar-center">
          <p class="topbar-title">Geology of Ariyalur Website</p>
          <p class="topbar-subtitle">You are Browsing Top Menubar Items</p>
        </div>

        <a class="arrow-link" href="AriyalurIndustries.html" aria-label="Go to Next Item in Menu">
          <img class="arrow-img" src="Arrow Right Very Small Amber.jpg" alt="Right Arrow" />
        </a>
      </div>

      <div class="topbar-actions">
        <a href="AriyalurGeologyPage.html">
          <button type="button" class="nav-btn">Back to Main Menu</button>
        </a>
        <a href="index1.html">
          <button type="button" class="nav-btn">Go to Home Page</button>
        </a>
      </div>
    </header>  

    <h1 align="center">Feedback Form</h1>

   <div class="center-container">   
    
        <form id="sheetdb-form" action="https://sheetdb.io/api/v1/kqqzvr8yr4uy3" method="post"  onsubmit="return handleSubmit(event)">
            <!-- Hidden input for the Timestamp -->
            <input type="hidden" name="data[DATE]" id="timestamp-field">

            <label for="fullname">Your Full Name :</label>
            <input type="text" name="data[NAME]" id="uname" placeholder="name">
            
            <label for="email">Your Email :</label>
            <input type="text" name="data[EMAIL]" id="uemail-field" placeholder="Enter Valid email" required>
        
            <label for="phone">Your Phone Number :</label>
            <input type="number" name="data[PHONE]" id="uphone" placeholder="phone number">

            <!-- <label for="message"> Your Feedback:</label>
            <input type="text" name="data[MESSAGE]" id="umsg" placeholder="your feedback.."> -->

            <label for="message"> Your Feedback:</label>
            <textarea type="text" name="data[FEEDBACK]"  id="ufeedback" placeholder="your feedback"></textarea> 

            <div class="button-container">
                <input  type="submit" value="Submit Feedback">
            </div>
        </form>
    </div>

    <script>           
            function setTimestamp() {                
                console.log("Function one executed");
                // perform actions
                const timestampInput = document.getElementById('timestamp-field');            
                const currentDate = new Date();    //.toLocalString(); 

                // Format the date as Date-Time (database/System Specific) Like This '20/1/2026, 12:21:49 pm'
                timestampInput.value = currentDate.toLocaleString();  //.toISOString(); give: 2026-01-19T04:57:43.222Z

                //Format the date with the full month name
                // const options = { year: 'numeric', month: 'long', day: 'numeric', hours: '2-digit', minute: '2-digit'};
                const formattedDateTime = now.toLocaleString(undefined, options); // Using default locale

                //Set the value of the hidden timestamp field
                document.getElementById('timestamp-field').value =  timestampInput;  
                // Code above Writes the DATE cell of SheetDB with Formatted Date and Time;

                // The form will now submit with the added Timestamp field to SheetDB
                return true; // or false for validation
            }                        

            function validateEmail() {
                emailLabel.style.bottom = "45px";

            if(!emailField.value.match(/^[A-Za-z\._\-0-9]*[@][A-Za-z]*[\.][a-z]{2,4}$/)){
                emailError.innerHTML = "Please enter a valid email";
                emailField.style.borderBottomColor = "red";
                emailError.style.top = "120%";
                return true;
                }     
            }

            function handleSubmit(event) {
                // You might want to prevent the default behavior first
                // event.prevent.Default();

                const resultOne = setTimestamp();
                const resultTwo = validateEmail();
                //const resultTwo = checkForValidEmail();

                //Return the combined result if both to be true for submission
                return resultOne && resultTwo;                
            }                  
    </script>

    <script> -->
        var form = document.getElementById('sheetdb-form');
        form.addEventListener("submit", e => {
            e.preventDefault();

            fetch(form.action, {
                method: "post",
                body: new FormData(document.getElementById("sheetdb-form")),
            }).then(
                response => response.json()
            ).then((html) => {
                alert('Submitted !! Thank you for your valuable feedback ' + document.getElementById('uname').value)
                window.location.href = '';
                location.reload();
            });
        });        
    </script> 

    <div class="button-container" style=display:flex; align-items:center;>
        <a href="AriyalurGeologyPage.html">
          <button type="button" class="nav-btn">Back to Main Menu</button>
        </a>
        <a href="index1.html">
          <button type="button" class="nav-btn">Go to Home Page</button>
        </a>
      </div>      
    
</body>
</html>
